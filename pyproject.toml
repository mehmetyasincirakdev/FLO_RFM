[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flo-rfm"
version = "1.0.0"
description = "RFM customer segmentation and campaign audience generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1.0",
]

[project.scripts]
flo-rfm = "flo_rfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
